services:
  - type: web
    name: sunny-kart-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: MAX_CLIENTS
        value: '32'
      - key: MAX_ROOMS
        value: '8'
